name: Branch Naming Convention

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Branch Name Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix|release|dependabot)/[a-z0-9._-]+$"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "Branch name '$BRANCH' follows the convention."
          else
            echo "::error::Branch name '$BRANCH' does not follow the naming convention."
            echo ""
            echo "Expected format: <type>/<short-description>"
            echo ""
            echo "Valid types:"
            echo "  feat/     - New feature"
            echo "  fix/      - Bug fix"
            echo "  docs/     - Documentation"
            echo "  style/    - Code style (formatting, no logic change)"
            echo "  refactor/ - Code refactoring"
            echo "  perf/     - Performance improvement"
            echo "  test/     - Adding or updating tests"
            echo "  build/    - Build system or dependencies"
            echo "  ci/       - CI/CD configuration"
            echo "  chore/    - Maintenance tasks"
            echo "  revert/   - Reverting changes"
            echo "  hotfix/   - Urgent production fix"
            echo "  release/  - Release preparation"
            echo ""
            echo "Examples:"
            echo "  feat/add-tag-caching"
            echo "  fix/duplicate-slug-generation"
            echo "  docs/update-readme"
            echo "  refactor/tag-model-cleanup"
            exit 1
          fi
