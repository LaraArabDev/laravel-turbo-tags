name: Release

# Runs on every push to main (after PR merge).
# Determines version bump from:
#   1. Source branch prefix  →  breaking/* / major/* = major
#                               feature/* / feat/*   = minor
#                               hotfix/* / fix/* / bugfix/* / patch/* = patch
#   2. Commit message type   →  feat: = minor | fix:/perf: = patch | BREAKING CHANGE / !: = major
#   3. chore/docs/style/test/ci/refactor → no release created

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Determine version bump ──────────────────────────────────────────────

      - name: Determine bump type
        id: bump
        run: |
          # Last commit subject (squash-merge = PR title; merge commit = "Merge pull request…")
          COMMIT_MSG=$(git log -1 --format="%s")
          COMMIT_BODY=$(git log -1 --format="%b")

          # Extract source branch from a merge-commit message
          # e.g. "Merge pull request #12 from owner/feature/my-thing"
          BRANCH=$(echo "$COMMIT_MSG" | grep -oP 'from [^/]+/\K.+' || true)

          echo "commit_msg=$COMMIT_MSG"
          echo "branch=$BRANCH"

          BUMP=""

          # Regex patterns stored in variables to avoid bash parsing issues
          RE_BREAKING_SPACE='BREAKING[[:space:]]CHANGE'
          RE_BREAKING_BANG='^[a-z]+(\([^)]+\))?!:'
          RE_FEAT='^feat(\([^)]+\))?:'
          RE_FIX='^(fix|perf|hotfix)(\([^)]+\))?:'
          RE_BRANCH_MAJOR='^(breaking|major)/'
          RE_BRANCH_MINOR='^(feature|feat)/'
          RE_BRANCH_PATCH='^(hotfix|fix|bugfix|patch)/'

          # Check for breaking changes
          HAS_BREAKING_MSG=$(echo "$COMMIT_MSG" | grep -cE "$RE_BREAKING_SPACE" || true)
          HAS_BREAKING_BODY=$(echo "$COMMIT_BODY" | grep -cE "$RE_BREAKING_SPACE" || true)
          HAS_BREAKING_BANG=$(echo "$COMMIT_MSG" | grep -cE "$RE_BREAKING_BANG" || true)

          # ── 1. Branch-name wins ────────────────────────────────────────────
          if [[ "$BRANCH" =~ $RE_BRANCH_MAJOR ]]; then
            BUMP="major"
          elif [[ "$BRANCH" =~ $RE_BRANCH_MINOR ]]; then
            BUMP="minor"
          elif [[ "$BRANCH" =~ $RE_BRANCH_PATCH ]]; then
            BUMP="patch"
          fi

          # ── 2. Conventional commit type (fallback / override for BREAKING) ─
          if [[ -z "$BUMP" ]] || [[ "$HAS_BREAKING_MSG" -gt 0 ]] || [[ "$HAS_BREAKING_BODY" -gt 0 ]] || [[ "$HAS_BREAKING_BANG" -gt 0 ]]; then
            if [[ "$HAS_BREAKING_MSG" -gt 0 ]] || [[ "$HAS_BREAKING_BODY" -gt 0 ]] || [[ "$HAS_BREAKING_BANG" -gt 0 ]]; then
              BUMP="major"
            elif echo "$COMMIT_MSG" | grep -qE "$RE_FEAT"; then
              BUMP="minor"
            elif echo "$COMMIT_MSG" | grep -qE "$RE_FIX"; then
              BUMP="patch"
            fi
          fi

          # ── 3. No release for maintenance commits ─────────────────────────
          if [[ -z "$BUMP" ]]; then
            echo "No release needed for this commit type."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Calculate next version ─────────────────────────────────────────────

      - name: Calculate next version
        if: steps.bump.outputs.skip == 'false'
        id: version
        run: |
          # Latest semver tag (default to v0.0.0 if none exists)
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          echo "latest_tag=$LATEST"

          # Strip leading 'v'
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          BUMP="${{ steps.bump.outputs.bump }}"

          if [[ "$BUMP" == "major" ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "$BUMP" == "minor" ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG (bump: $BUMP)"

      # ── Create and push tag ────────────────────────────────────────────────

      - name: Push tag
        if: steps.bump.outputs.skip == 'false'
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      # ── Generate changelog since previous tag ──────────────────────────────

      - name: Generate changelog
        if: steps.bump.outputs.skip == 'false'
        id: changelog
        run: |
          PREV="${{ steps.version.outputs.previous_tag }}"
          NEW="${{ steps.version.outputs.new_tag }}"

          if git rev-parse "$PREV" >/dev/null 2>&1; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Collect commits grouped by type
          BREAKING=$(git log $RANGE --format="- %s" | grep -E '!:|BREAKING CHANGE' || true)
          FEATURES=$(git log $RANGE --format="- %s" | grep -E '^- feat(\([^)]+\))?: ' || true)
          FIXES=$(git log $RANGE --format="- %s" | grep -E '^- (fix|perf|hotfix)(\([^)]+\))?: ' || true)
          OTHERS=$(git log $RANGE --format="- %s" | grep -vE '^- (feat|fix|perf|hotfix)(\([^)]+\))?: ' | grep -vE '!:|BREAKING CHANGE' | grep -vE '^- Merge ' || true)

          BODY=""
          [[ -n "$BREAKING" ]] && BODY+="### ⚠️ Breaking Changes\n$BREAKING\n\n"
          [[ -n "$FEATURES" ]] && BODY+="### ✨ Features\n$FEATURES\n\n"
          [[ -n "$FIXES"    ]] && BODY+="### 🐛 Bug Fixes\n$FIXES\n\n"
          [[ -n "$OTHERS"   ]] && BODY+="### 🔧 Other Changes\n$OTHERS\n\n"
          [[ -z "$BODY"     ]] && BODY="No significant changes.\n"

          BODY+="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${NEW}"

          # Write to file to handle multi-line safely
          printf "$BODY" > changelog.md
          cat changelog.md

      # ── Create GitHub Release ──────────────────────────────────────────────

      - name: Create GitHub Release
        if: steps.bump.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: changelog.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ────────────────────────────────────────────────────────────

      - name: Summary
        if: steps.bump.outputs.skip == 'false'
        run: |
          echo "### Released ${{ steps.version.outputs.new_tag }} 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.version.outputs.previous_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New      | \`${{ steps.version.outputs.new_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump     | \`${{ steps.version.outputs.bump_type }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (skipped)
        if: steps.bump.outputs.skip == 'true'
        run: |
          echo "### No release created ⏭️" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit type does not trigger a version bump (chore/docs/style/test/ci/refactor)." >> "$GITHUB_STEP_SUMMARY"
